# OpenCode Go sidebar foot: meters, model catalog, DSH version.
#
# The Host half owns the credential and every upstream call; the Client half
# only reads computed answers from three same-origin routes, so the API key
# never reaches the browser.
- insert:
    - id: opencode-go-quota
      name: '@local/opencode-go-quota'
      config:
        # Base URL of the OpenCode Go inference API; `/usage` and `/models` are appended.
        baseUrl: https://opencode.ai/zen/go/v1
        # Environment-variable name resolved through ctx.credentials.
        apiKeyEnv: OPENCODE_GO_API_KEY
        # Meter answers are cached this long; the page polls at its own pace.
        refreshMs: 60000
        # Catalog and version answers move slowly, and the release feed is
        # rate-limited, so they are cached far longer.
        infoRefreshMs: 900000
        # Per-request upstream timeout.
        timeoutMs: 15000
        # Where published Harness versions are read from.
        registryUrl: https://registry.npmjs.org
        # Where the bilingual release notes are read from.
        releasesRepo: deepseek-ai/deepseek-harness
